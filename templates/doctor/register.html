{% extends "base.html" %}

{% block title %}Doctor Registration — MedicalBot{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-4rem)] bg-gray-50 flex items-center justify-center py-12 px-4">
  <div class="w-full max-w-lg">

    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
      <div class="text-center mb-8">
        <div class="w-12 h-12 bg-emerald-100 rounded-2xl flex items-center justify-center mx-auto mb-4">
          <svg class="w-6 h-6 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/>
          </svg>
        </div>
        <h1 class="text-2xl font-bold text-gray-900">Create Doctor Account</h1>
        <p class="text-sm text-gray-500 mt-1">Doctor Portal registration</p>
      </div>

      <!-- Error banner -->
      <div id="error-banner" class="hidden mb-5 p-4 bg-red-50 border border-red-200 rounded-xl">
        <p id="error-text" class="text-sm text-red-700"></p>
      </div>

      <form id="register-form" novalidate class="space-y-5">
        <!-- Name -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1" for="name">Full Name</label>
          <input id="name" name="name" type="text" autocomplete="name" required
                 placeholder="e.g. Dr. Sara Ahmed"
                 class="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent"/>
        </div>

        <!-- Specialization + License row -->
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1" for="specialization">Specialization</label>
            <select id="specialization" name="specialization" required
                    class="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-sm bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent">
              <option value="general_practice">General Practice</option>
              <option value="cardiology">Cardiology</option>
              <option value="dermatology">Dermatology</option>
              <option value="neurology">Neurology</option>
              <option value="orthopedics">Orthopedics</option>
              <option value="pediatrics">Pediatrics</option>
              <option value="emergency_medicine">Emergency Medicine</option>
              <option value="internal_medicine">Internal Medicine</option>
              <option value="psychiatry">Psychiatry</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1" for="license_number">License Number</label>
            <input id="license_number" name="license_number" type="text" required
                   placeholder="e.g. PMDC-12345"
                   class="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent"/>
          </div>
        </div>

        <!-- Email -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1" for="email">Email Address</label>
          <input id="email" name="email" type="email" autocomplete="email" required
                 placeholder="doctor@hospital.com"
                 class="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent"/>
        </div>

        <!-- Password -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1" for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="new-password" required
                 placeholder="At least 8 characters"
                 class="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent"/>
        </div>

        <!-- Confirm Password -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1" for="password_confirm">Confirm Password</label>
          <input id="password_confirm" name="password_confirm" type="password" autocomplete="new-password" required
                 placeholder="Re-enter your password"
                 class="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent"/>
          <p id="pw-hint" class="hidden mt-1 text-xs text-red-600">Passwords do not match.</p>
        </div>

        <button id="submit-btn" type="submit"
                class="w-full py-3 bg-emerald-600 text-white font-semibold rounded-xl hover:bg-emerald-700 transition-colors focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed">
          Create Doctor Account
        </button>
      </form>

      <p class="text-center text-sm text-gray-500 mt-6">
        Already have an account?
        <a href="{% url 'doctor-login-page' %}" class="text-emerald-600 font-medium hover:underline">Log in</a>
      </p>
    </div>

  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  if (localStorage.getItem('access_token') && localStorage.getItem('user_role') === 'doctor') {
    window.location.replace('/doctor/dashboard/');
  }

  const form        = document.getElementById('register-form');
  const btn         = document.getElementById('submit-btn');
  const errorBanner = document.getElementById('error-banner');
  const errorText   = document.getElementById('error-text');
  const pwField     = document.getElementById('password');
  const pwConfirm   = document.getElementById('password_confirm');
  const pwHint      = document.getElementById('pw-hint');

  function checkPasswordMatch() {
    const mismatch = pwConfirm.value && pwField.value !== pwConfirm.value;
    pwHint.classList.toggle('hidden', !mismatch);
    pwConfirm.classList.toggle('border-red-400', mismatch);
    btn.disabled = mismatch;
  }

  pwField.addEventListener('input', checkPasswordMatch);
  pwConfirm.addEventListener('input', checkPasswordMatch);

  function showError(msg) {
    errorText.textContent = msg;
    errorBanner.classList.remove('hidden');
    btn.disabled = false;
    btn.textContent = 'Create Doctor Account';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (pwField.value !== pwConfirm.value) {
      checkPasswordMatch();
      return;
    }
    errorBanner.classList.add('hidden');
    btn.disabled = true;
    btn.textContent = 'Creating account…';

    const name = document.getElementById('name').value.trim();
    const payload = {
      name,
      specialization:   document.getElementById('specialization').value,
      license_number:   document.getElementById('license_number').value.trim(),
      email:            document.getElementById('email').value.trim(),
      password:         document.getElementById('password').value,
      password_confirm: document.getElementById('password_confirm').value,
    };

    try {
      const res  = await fetch('/api/doctor/register/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await res.json();

      if (!res.ok) {
        const msgs = Object.values(data).flat().join(' ');
        showError(msgs);
        return;
      }

      localStorage.setItem('access_token',  data.tokens.access);
      localStorage.setItem('refresh_token', data.tokens.refresh);
      localStorage.setItem('doctor_id',     data.doctor_id);
      localStorage.setItem('doctor_name',   name);
      localStorage.setItem('user_role',     'doctor');

      window.location.href = '/doctor/dashboard/';

    } catch {
      showError('Network error. Please try again.');
    }
  });
</script>
{% endblock %}
