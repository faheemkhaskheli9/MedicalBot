{% extends "base.html" %}

{% block title %}My Profile — MedicalBot{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-4rem)] bg-gray-50 py-10 px-4">
  <div class="max-w-2xl mx-auto space-y-6">

    <!-- Loading state -->
    <div id="loading" class="text-center py-20 text-gray-400 text-sm">Loading your profile…</div>

    <!-- Error state -->
    <div id="error-state" style="display:none"
         class="bg-red-50 border border-red-200 rounded-2xl p-6 text-center">
      <p id="error-msg" class="text-sm text-red-700 mb-4"></p>
      <a href="{% url 'patient-login-page' %}"
         class="inline-block px-5 py-2 bg-blue-600 text-white text-sm font-semibold rounded-xl hover:bg-blue-700 transition-colors">
        Log In Again
      </a>
    </div>

    <!-- Profile content (hidden until loaded) -->
    <div id="profile-content" style="display:none" class="space-y-6">

      <!-- Header card -->
      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 flex items-center gap-5">
        <div id="avatar"
             class="w-16 h-16 rounded-2xl bg-blue-600 text-white text-xl font-bold flex items-center justify-center flex-shrink-0">
        </div>
        <div class="min-w-0">
          <h1 id="profile-name" class="text-xl font-bold text-gray-900 truncate"></h1>
          <p class="text-sm text-gray-500 mt-0.5">Patient Portal</p>
          <p class="text-xs text-gray-400 mt-1 font-mono">
            ID: <span id="profile-patient-id"></span>
          </p>
        </div>
      </div>

      <!-- Personal information -->
      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
        <h2 class="text-sm font-semibold text-gray-500 uppercase tracking-wide mb-4">Personal Information</h2>
        <dl class="space-y-4">
          <div class="flex items-center justify-between py-2 border-b border-gray-50">
            <dt class="text-sm text-gray-500 w-28 flex-shrink-0">Email</dt>
            <dd id="profile-email" class="text-sm font-medium text-gray-900 text-right truncate"></dd>
          </div>
          <div class="flex items-center justify-between py-2 border-b border-gray-50">
            <dt class="text-sm text-gray-500 w-28 flex-shrink-0">Phone</dt>
            <dd id="profile-phone" class="text-sm font-medium text-gray-900 text-right"></dd>
          </div>
          <div class="flex items-center justify-between py-2 border-b border-gray-50">
            <dt class="text-sm text-gray-500 w-28 flex-shrink-0">Age</dt>
            <dd id="profile-age" class="text-sm font-medium text-gray-900 text-right"></dd>
          </div>
          <div class="flex items-center justify-between py-2 border-b border-gray-50">
            <dt class="text-sm text-gray-500 w-28 flex-shrink-0">Gender</dt>
            <dd id="profile-gender" class="text-sm font-medium text-gray-900 text-right capitalize"></dd>
          </div>
          <div class="flex items-center justify-between py-2">
            <dt class="text-sm text-gray-500 w-28 flex-shrink-0">Member since</dt>
            <dd id="profile-joined" class="text-sm font-medium text-gray-900 text-right"></dd>
          </div>
        </dl>
      </div>

      <!-- Actions -->
      <div class="flex justify-end">
        <button onclick="logoutPatient()"
                class="px-5 py-2.5 text-sm font-semibold text-red-600 border border-red-200 rounded-xl hover:bg-red-50 transition-colors">
          Log Out
        </button>
      </div>

    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  const GENDER_LABELS = {
    male: 'Male', female: 'Female', other: 'Other', prefer_not_to_say: 'Prefer not to say',
  };

  async function loadProfile() {
    const token = localStorage.getItem('access_token');
    if (!token) {
      window.location.href = '{% url "patient-login-page" %}';
      return;
    }

    try {
      const res = await fetch('/api/patient/profile/', {
        headers: { 'Authorization': `Bearer ${token}` },
      });

      if (res.status === 401) {
        localStorage.clear();
        window.location.href = '{% url "patient-login-page" %}';
        return;
      }

      if (!res.ok) {
        showError('Failed to load profile. Please try again.');
        return;
      }

      const data = await res.json();
      renderProfile(data);
    } catch {
      showError('Network error. Please check your connection.');
    }
  }

  function renderProfile(data) {
    const initials = data.name
      .split(' ')
      .map(w => w[0])
      .slice(0, 2)
      .join('')
      .toUpperCase();

    document.getElementById('avatar').textContent = initials;
    document.getElementById('profile-name').textContent = data.name;
    document.getElementById('profile-patient-id').textContent = data.patient_id;
    document.getElementById('profile-email').textContent = data.email;
    document.getElementById('profile-phone').textContent = data.phone;
    document.getElementById('profile-age').textContent = data.age + ' years';
    document.getElementById('profile-gender').textContent = GENDER_LABELS[data.gender] || data.gender;
    document.getElementById('profile-joined').textContent = new Date(data.date_joined).toLocaleDateString('en-GB', {
      day: 'numeric', month: 'long', year: 'numeric',
    });

    document.getElementById('loading').style.display = 'none';
    document.getElementById('profile-content').style.display = 'block';
  }

  function showError(msg) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error-msg').textContent = msg;
    document.getElementById('error-state').style.display = 'block';
  }

  loadProfile();
</script>
{% endblock %}
