{% extends "base.html" %}

{% block title %}Log In — MedicalBot{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-4rem)] bg-gray-50 flex items-center justify-center py-12 px-4">
  <div class="w-full max-w-md">

    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
      <div class="text-center mb-8">
        <div class="w-12 h-12 bg-blue-100 rounded-2xl flex items-center justify-center mx-auto mb-4">
          <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
          </svg>
        </div>
        <h1 class="text-2xl font-bold text-gray-900">Welcome back</h1>
        <p class="text-sm text-gray-500 mt-1">Log in to your Patient Portal</p>
      </div>

      <!-- Error banner -->
      <div id="error-banner" class="hidden mb-5 p-4 bg-red-50 border border-red-200 rounded-xl">
        <p id="error-text" class="text-sm text-red-700"></p>
      </div>

      <form id="login-form" novalidate class="space-y-5">
        <!-- Email -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1" for="email">Email Address</label>
          <input id="email" name="email" type="email" autocomplete="email" required
                 placeholder="ali@example.com"
                 class="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"/>
        </div>

        <!-- Password -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1" for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required
                 placeholder="Your password"
                 class="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"/>
        </div>

        <!-- Submit -->
        <button id="submit-btn" type="submit"
                class="w-full py-3 bg-blue-600 text-white font-semibold rounded-xl hover:bg-blue-700 transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed">
          Log In
        </button>
      </form>

      <p class="text-center text-sm text-gray-500 mt-6">
        Don't have an account?
        <a href="{% url 'patient-register-page' %}" class="text-blue-600 font-medium hover:underline">Create one</a>
      </p>
    </div>

  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  const form  = document.getElementById('login-form');
  const btn   = document.getElementById('submit-btn');
  const errorBanner = document.getElementById('error-banner');
  const errorText   = document.getElementById('error-text');

  function showError(msg) {
    errorText.textContent = msg;
    errorBanner.classList.remove('hidden');
    btn.disabled = false;
    btn.textContent = 'Log In';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBanner.classList.add('hidden');
    btn.disabled = true;
    btn.textContent = 'Logging in…';

    const payload = {
      email:    document.getElementById('email').value.trim(),
      password: document.getElementById('password').value,
    };

    try {
      const res = await fetch('/api/patient/login/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await res.json();

      if (!res.ok) {
        const msgs = Object.values(data).flat().join(' ');
        showError(msgs);
        return;
      }

      localStorage.setItem('access_token',  data.tokens.access);
      localStorage.setItem('refresh_token', data.tokens.refresh);
      localStorage.setItem('patient_id',    data.patient_id);

      window.location.href = '/';

    } catch {
      showError('Network error. Please try again.');
    }
  });
</script>
{% endblock %}
