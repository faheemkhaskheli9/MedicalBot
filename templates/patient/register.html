{% extends "base.html" %}

{% block title %}Register — MedicalBot{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-4rem)] bg-gray-50 flex items-center justify-center py-12 px-4">
  <div class="w-full max-w-lg">

    <!-- Card -->
    <div id="form-card" class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
      <div class="text-center mb-8">
        <div class="w-12 h-12 bg-blue-100 rounded-2xl flex items-center justify-center mx-auto mb-4">
          <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
          </svg>
        </div>
        <h1 class="text-2xl font-bold text-gray-900">Create your account</h1>
        <p class="text-sm text-gray-500 mt-1">Patient Portal registration</p>
      </div>

      <!-- Error banner -->
      <div id="error-banner" class="hidden mb-5 p-4 bg-red-50 border border-red-200 rounded-xl">
        <p id="error-text" class="text-sm text-red-700"></p>
      </div>

      <form id="register-form" novalidate class="space-y-5">
        <!-- Name -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1" for="name">Full Name</label>
          <input id="name" name="name" type="text" autocomplete="name" required
                 placeholder="e.g. Ali Khan"
                 class="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"/>
        </div>

        <!-- Age + Gender row -->
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1" for="age">Age</label>
            <input id="age" name="age" type="number" min="1" max="150" required
                   placeholder="e.g. 30"
                   class="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"/>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1" for="gender">Gender</label>
            <select id="gender" name="gender" required
                    class="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
              <option value="">Select…</option>
              <option value="male">Male</option>
              <option value="female">Female</option>
              <option value="other">Other</option>
              <option value="prefer_not_to_say">Prefer not to say</option>
            </select>
          </div>
        </div>

        <!-- Phone -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1" for="phone">Phone Number</label>
          <input id="phone" name="phone" type="tel" autocomplete="tel" required
                 placeholder="e.g. 03001234567"
                 class="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"/>
        </div>

        <!-- Email -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1" for="email">Email Address</label>
          <input id="email" name="email" type="email" autocomplete="email" required
                 placeholder="e.g. ali@example.com"
                 class="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"/>
        </div>

        <!-- Password -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1" for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="new-password" required
                 placeholder="At least 8 characters"
                 class="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"/>
        </div>

        <!-- Confirm Password -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1" for="password_confirm">Confirm Password</label>
          <input id="password_confirm" name="password_confirm" type="password" autocomplete="new-password" required
                 placeholder="Re-enter your password"
                 class="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"/>
        </div>

        <!-- Submit -->
        <button id="submit-btn" type="submit"
                class="w-full py-3 bg-blue-600 text-white font-semibold rounded-xl hover:bg-blue-700 transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed">
          Create Account
        </button>
      </form>

      <p class="text-center text-sm text-gray-500 mt-6">
        Already have an account?
        <a href="{% url 'patient-login-page' %}" class="text-blue-600 font-medium hover:underline">Log in</a>
      </p>
    </div>


  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  const form = document.getElementById('register-form');
  const btn  = document.getElementById('submit-btn');
  const errorBanner = document.getElementById('error-banner');
  const errorText   = document.getElementById('error-text');

  function showError(msg) {
    errorText.textContent = msg;
    errorBanner.classList.remove('hidden');
    btn.disabled = false;
    btn.textContent = 'Create Account';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBanner.classList.add('hidden');
    btn.disabled = true;
    btn.textContent = 'Creating account…';

    const payload = {
      name:             document.getElementById('name').value.trim(),
      age:              parseInt(document.getElementById('age').value, 10),
      gender:           document.getElementById('gender').value,
      phone:            document.getElementById('phone').value.trim(),
      email:            document.getElementById('email').value.trim(),
      password:         document.getElementById('password').value,
      password_confirm: document.getElementById('password_confirm').value,
    };

    try {
      const res = await fetch('/api/patient/register/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await res.json();

      if (!res.ok) {
        const msgs = Object.values(data).flat().join(' ');
        showError(msgs);
        return;
      }

      localStorage.setItem('access_token',  data.tokens.access);
      localStorage.setItem('refresh_token', data.tokens.refresh);
      localStorage.setItem('patient_id',    data.patient_id);
      localStorage.setItem('patient_name',  payload.name);

      window.location.href = '/patient/profile/';

    } catch {
      showError('Network error. Please try again.');
    }
  });
</script>
{% endblock %}
